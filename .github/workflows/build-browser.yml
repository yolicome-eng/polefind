name: Build Browser Candidate # rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - browser_main.py
      - .github/workflows/build-browser.yml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl selenium pyinstaller
      - name: Build
        run: |
          pyinstaller --onefile --windowed --name polefind --collect-all selenium --hidden-import=selenium.webdriver.chrome.webdriver --hidden-import=selenium.webdriver.chrome.service --hidden-import=selenium.webdriver.common.driver_finder browser_main.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: polefind-windows-final
          path: dist/polefind.exe
